# deploy/helm/values.yaml
# Base defaults — all values are overridden by Terraform's helm_release (traceroot.tf)

global:
  security:
    allowInsecureImages: true

imagePullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: traceroot
  annotations: {}

# --- Services ---
web:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

rest:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

worker:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  pollIntervalSeconds: "5"
  batchSize: "100"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

billing:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  usageMeteringCron: "5 * * * *"
  resources:
    requests:
      cpu: "128m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

agent:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  port: 8100
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

detector:
  image:
    repository: ""
    tag: "latest"
  replicas: 1
  # Per-attempt LLM eval timeout (ms). High enough to absorb slow/throttled
  # BYOK providers (e.g. Z.AI glm) so their evals complete instead of timing out.
  evalTimeoutMs: "180000"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# --- Ingress (overridden by Terraform with TLS config) ---
ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  # Stop the load balancer routing the service-to-service API. Callers reach it
  # over cluster DNS, so this is also correct for a single-cluster self-host.
  # Set false to restore the previous behaviour without rebuilding an image.
  blockInternalRoutes: true
  internalRoutePrefix: /api/v1/internal

# --- External services (injected by Terraform) ---
postgresql:
  host: ""
  database: ""
  existingSecret: "traceroot"
  secretKeys:
    databaseUrl: "database-url"
    password: "postgres-password"

redis:
  existingSecret: "traceroot"
  secretKeys:
    url: "redis-url"

s3:
  bucket: ""
  region: ""
  endpoint: ""
  forcePathStyle: false

# --- ClickHouse (Bitnami subchart) ---
clickhouse:
  deploy: true
  # The bundled ClickHouse image already grants its admin CREATE USER, ALTER USER
  # and SET DEFINER, which is everything the SQL gateway's provisioning needs, so
  # nothing extra is required here for the default deployment. Verified directly
  # against bitnamilegacy/clickhouse:25.2.1-debian-12-r0.
  #
  # An external ClickHouse whose admin is narrower can be granted it explicitly,
  # which is why this is documented rather than assumed:
  #   usersExtraOverrides: |
  #     <clickhouse>
  #       <users>
  #         <default><access_management>1</access_management></default>
  #       </users>
  #     </clickhouse>
  # Left unset by default: the chart should not widen an admin that does not need
  # it, and setting it forces a ClickHouse pod restart.
  image:
    repository: bitnamilegacy/clickhouse
  auth:
    username: default
    existingSecret: "traceroot"
    existingSecretKey: "clickhouse-password"
  replicaCount: 1
  shards: 1
  zookeeper:
    enabled: false
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "efs"

# --- Migrations ---
migrations:
  # How long a finished migration Job -- and so its pod, and so its log -- is kept
  # before Kubernetes collects it. This is the only record of what a release applied
  # for anyone without cluster-admin, so it is retained rather than deleted on
  # success. Null keeps it indefinitely. Note this covers failed Jobs too, so a very
  # short value discards the diagnostics from a failure as well; 0 collects both the
  # instant they finish, which defeats the point of retaining them at all.
  retainFinishedSeconds: 604800
  postgres:
    image:
      repository: ""
      tag: "latest"
  clickhouse:
    image:
      repository: ""
      tag: "latest"

# --- Public SQL gateway (optional) ---
# Provisions two dedicated ClickHouse identities: a writer that owns the curated
# read-only views (they are created SQL SECURITY DEFINER, so the view body reads
# the physical tables under the writer's privileges) and a least-privileged user
# that customer SQL actually runs as, holding SELECT on the views only and
# capped by a readonly settings profile.
#
# Off by default. Enabling creates database users and requires granting the
# ClickHouse admin access management (see the clickhouse block below), neither of
# which an installation that does not serve the gateway needs.
sqlGateway:
  enabled: false
  # Also runs a hook after the migration that asserts the views carry the
  # expected definer and that the read-only user is refused the physical tables.
  verify: true
  writerUser: sql_gateway_writer
  readonlyUser: sql_gateway_ro
  settingsProfile: sql_readonly_profile
  # Keys read from clickhouse.auth.existingSecret. Supply them however the rest
  # of that Secret is supplied; the chart never creates them.
  secretKeys:
    writerPassword: "clickhouse-writer-password"
    readonlyPassword: "clickhouse-ro-password"
  # Caps applied to the read-only profile, enforced by ClickHouse rather than by
  # the application. CONST in the profile stops a caller raising them per query.
  limits:
    maxExecutionTime: 30
    maxResultRows: 100000
    maxResultBytes: 536870912
    maxMemoryUsage: 4294967296
  # Supplies clickhouse-client for the two hooks; no extra registry or build is
  # involved. Same repository as the deployed server, but pinned independently,
  # because clickhouse.image.tag is unset and the server's tag comes from the
  # subchart default. Keep this in step with the server version when that moves —
  # a client far ahead of or behind the server is the failure this pin guards.
  image:
    repository: bitnamilegacy/clickhouse
    tag: 25.2.1-debian-12-r0

# --- Secrets (managed by Terraform) ---
secrets:
  existingSecret: "traceroot"
  keys:
    betterAuthSecret: "better-auth-secret"
    internalApiSecret: "internal-api-secret"
    encryptionKey: "encryption-key"

github:
  existingSecret: ""
  keys:
    appId: "github-app-id"
    appName: "github-app-name"
    clientId: "github-app-client-id"
    clientSecret: "github-app-client-secret"
    privateKey: "github-app-private-key"
    oauthRedirectUri: "github-oauth-redirect-uri"

llmKeys:
  existingSecret: ""
  keys:
    anthropicApiKey: "anthropic-api-key"
    openaiApiKey: "openai-api-key"
    daytonaApiKey: "daytona-api-key"

betterAuth:
  url: ""

# --- Feature flags ---
enableBilling: "true"

# --- Sandbox provider ---
sandboxProvider: "daytona"

# --- Branding / Public URLs ---
branding:
  logoUrl: "https://raw.githubusercontent.com/traceroot-ai/traceroot/main/frontend/ui/public/images/traceroot_icon.png"
  docsUrl: "https://traceroot.ai/docs"
  githubRepoUrl: "https://github.com/traceroot-ai/traceroot"
  githubIssuesUrl: "https://github.com/traceroot-ai/traceroot/issues"
  discordInviteUrl: "https://discord.gg/TM2m3CtKuC"

# --- Stripe (optional — set existingSecret to enable) ---
stripe:
  existingSecret: ""
  keys:
    secretKey: "stripe-secret-key"
    webhookSigningSecret: "stripe-webhook-signing-secret"
    priceIdStarter: "stripe-price-id-starter"
    priceIdPro: "stripe-price-id-pro"
    priceIdAiUsage: "stripe-price-id-ai-usage"
    priceIdRcaUsage: "stripe-price-id-rca-usage"
    priceIdDetectorUsage: "stripe-price-id-detector-usage"

# --- Google OAuth (optional — set existingSecret to enable) ---
googleOAuth:
  existingSecret: ""
  keys:
    clientId: "google-client-id"
    clientSecret: "google-client-secret"

# --- Slack (optional — set existingSecret to enable Slack workspace OAuth) ---
slack:
  existingSecret: ""
  keys:
    clientId: "slack-client-id"
    clientSecret: "slack-client-secret"
    stateSecret: "slack-state-secret"
    redirectUri: "slack-redirect-uri"

# --- Email / SMTP (optional — set existingSecret to enable) ---
smtp:
  existingSecret: ""
  keys:
    url: "smtp-url"
    mailFrom: "smtp-mail-from"

# --- Enterprise license (optional) ---
enterprise:
  existingSecret: ""
  keys:
    licenseKey: "ee-license-key"

# --- Additional environment variables (escape hatch for anything not covered above) ---
additionalEnv: []
