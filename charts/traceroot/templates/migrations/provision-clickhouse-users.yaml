{{/*
Renders on every install, not only when the gateway is enabled. The ClickHouse
migration creates the curated views with DEFINER = <writer> whether or not the
gateway serves traffic, and a missing definer fails that migration and with it the
release. So the writer is provisioned unconditionally; everything the gateway
alone needs -- the read-only user, its settings profile and its grants on the
views -- stays behind sqlGateway.enabled.
*/}}
{{- include "traceroot.sqlGateway.checkIdentities" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "traceroot.fullname" . }}-provision-clickhouse-users
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
  annotations:
    # Same install/upgrade phase as migrate-clickhouse but a lower weight, so the
    # gateway identities always exist before the migration creates the curated
    # views, whose DEFINER is the writer user. A missing writer fails the
    # CREATE VIEW outright, which is the intended, explicit dependency.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Retained after success on purpose; see migrate-clickhouse.yaml. This Job's
    # output is the only record that the identities were provisioned, for readers
    # who cannot open a ClickHouse session themselves.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  # Retained after success; bounded by the same knob as the migration job. Via the
  # shared helper, not inline: the value arrives as float64 from a values file and
  # int64 from --set, and Go renders a large float64 in exponent form, which is not
  # an integer and which the API server rejects mid-upgrade.
  {{- include "traceroot.migrations.ttl" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: provision-clickhouse-users
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: provision
          image: "{{ .Values.sqlGateway.image.repository }}:{{ .Values.sqlGateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # An array, not a string: a password containing whitespace or a glob
              # character would otherwise be re-split by the shell before it ever
              # reached the client, and authentication would fail for no visible reason.
              # Password through the environment, not argv: a --password argument is
              # readable in /proc/<pid>/cmdline for anything that can see the process.
              export CLICKHOUSE_PASSWORD="${CLICKHOUSE_ADMIN_PASSWORD}"
              CH=(clickhouse-client --host "{{ include "traceroot.clickhouse.hostname" . }}" --port 9000
                  --user "{{ include "traceroot.sqlGateway.shellSafe" (dict "name" "clickhouse.auth.username" "value" .Values.clickhouse.auth.username) }}")

              # Passwords are sent as their SHA-256 hash rather than as literals, so no
              # quote or backslash in a secret can terminate or alter the surrounding
              # DDL, and the raw value never appears in the statement at all. The
              # statements themselves go over stdin rather than --query: an argument is
              # readable in /proc/<pid>/cmdline by anything that can see the process,
              # and a hash there is still more than this needs to expose.
              {{- if .Values.sqlGateway.enabled }}
              # The Secret reference above already fails the pod if the key is absent.
              # This catches the other shape, a key that exists and is empty, which
              # would otherwise provision the account customer SQL runs as with the
              # hash of the empty string.
              if [ -z "${SQL_GATEWAY_RO_PASSWORD:-}" ]; then
                echo "FAIL: sqlGateway.enabled is set, so {{ .Values.sqlGateway.secretKeys.readonlyPassword }} must be non-empty in secret {{ .Values.clickhouse.auth.existingSecret }}."
                exit 1
              fi
              {{- end }}

              # The writer's password is generated here and discarded, never stored and
              # never read from a Secret. Nothing authenticates as this account: the
              # curated views are SQL SECURITY DEFINER, which runs the body under the
              # writer's grants and never asks for a password. A stored one would be a
              # standing credential that can read every project's raw rows, including
              # the columns the curated views deliberately omit, in exchange for nothing.
              # -v stops od collapsing a repeated block to `*`, which would shorten the
              # password instead of failing.
              WRITER_HASH=$(od -An -v -N32 -tx1 /dev/urandom | tr -d ' \n' | sha256sum | cut -d' ' -f1)
              {{- if .Values.sqlGateway.enabled }}
              RO_HASH=$(printf '%s' "${SQL_GATEWAY_RO_PASSWORD}" | sha256sum | cut -d' ' -f1)
              {{- end }}

              # This hook can fire before the ClickHouse pod is Ready. The budget stays
              # well inside Helm's default 5m hook timeout -- matching it would mean the
              # release aborts before the last retries ever run. The final error is kept
              # and printed, so a wrong password is distinguishable from a slow start
              # instead of looking identical for the whole window.
              READY=""
              for i in $(seq 1 24); do
                if POLL_ERR=$("${CH[@]}" --query "SELECT 1" 2>&1); then READY=yes; break; fi
                echo "waiting for clickhouse ($i/24)"; sleep 5
              done
              if [ -z "$READY" ]; then
                echo "gave up waiting for clickhouse after 120s; last error:"
                printf '%s\n' "$POLL_ERR"; exit 1
              fi

              echo "--- clickhouse version ---"
              "${CH[@]}" --query "SELECT version()"

              # Grants against a database that does not exist succeed and are recorded,
              # so a mistyped clickhouse.database leaves this hook green and fails the
              # migration afterwards with UNKNOWN_DATABASE. Checked here, where the
              # message can name the value that is wrong.
              if ! DB_COUNT=$("${CH[@]}" --query "SELECT count() FROM system.databases WHERE name = '{{ .Values.clickhouse.database }}'" 2>&1) || [ "$DB_COUNT" != "1" ]; then
                echo "FAIL: clickhouse.database is set to '{{ .Values.clickhouse.database }}', which does not exist on this server."
                echo "The chart does not create it. Create it, or point clickhouse.database at an existing database."
                printf '%s\n' "$DB_COUNT"
                exit 1
              fi

              # Creating users requires access management, which the stock admin
              # does not carry unless clickhouse.usersExtraOverrides grants it.
              # Printed before the DDL so a permissions failure below is
              # immediately explicable from this log alone.
              echo "--- grants held by the admin running this job ---"
              ADMIN_GRANTS=$("${CH[@]}" --query "SHOW GRANTS" 2>&1) || ADMIN_GRANTS=""
              printf '%s\n' "$ADMIN_GRANTS"

              # Advisory only, never fatal. An admin holding these through a granted
              # role prints just the role here, which a literal scan cannot see, and
              # failing on that would abort the release for a server that provisions
              # perfectly well. The statements below carry the real verdict.
              for NEEDED in "CREATE USER" "SET DEFINER"; do
                if ! grep -qF "$NEEDED" <<<"$ADMIN_GRANTS"; then
                  echo "note: $NEEDED is not listed directly for this account; it may still hold it through a role."
                fi
              done

              # Skipped entirely when the account is already there, so an operator who
              # provisions it themselves needs no privilege to create users at all. The
              # password is left alone in that case: it is not ours to rotate, and this
              # hook's generated one is worth nothing to anybody.
              NEED_CREATE=yes
              if USER_COUNT=$("${CH[@]}" --query "SELECT count() FROM system.users WHERE name = '{{ .Values.sqlGateway.writerUser }}'" 2>&1); then
                [ "$USER_COUNT" = "1" ] && NEED_CREATE=""
              fi

              echo "--- provisioning identities ---"
              if [ -n "$NEED_CREATE" ]; then
                if ! CREATED=$(printf '%s\n' "
                  CREATE USER IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }}
                      IDENTIFIED WITH sha256_hash BY '${WRITER_HASH}'" | "${CH[@]}" --multiquery 2>&1); then
                  echo "FAIL: could not create {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }}, which the ClickHouse migration needs as the definer of its curated views."
                  echo "Either grant this account CREATE USER (clickhouse.usersExtraOverrides enables access management on the bundled image),"
                  echo "or create {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }} yourself, in which case this hook leaves it alone."
                  printf '%s\n' "$CREATED"
                  exit 1
                fi
              else
                echo "{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }} already exists; leaving its password untouched"
              fi

              # Grants are recorded by name, so the read-only grants on the curated
              # views are accepted here even though the migration that creates those
              # views has not run yet.
              "${CH[@]}" --multiquery --query "
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans  TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }};
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }};
              "
              {{- if .Values.sqlGateway.enabled }}
              printf '%s\n' "
                CREATE SETTINGS PROFILE IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }} SETTINGS
                    readonly = 1,
                    max_execution_time = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxExecutionTime" "value" .Values.sqlGateway.limits.maxExecutionTime) }} CONST,
                    max_result_rows = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxResultRows" "value" .Values.sqlGateway.limits.maxResultRows) }} CONST,
                    max_result_bytes = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxResultBytes" "value" .Values.sqlGateway.limits.maxResultBytes) }} CONST,
                    max_memory_usage = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxMemoryUsage" "value" .Values.sqlGateway.limits.maxMemoryUsage) }} CONST;
                ALTER SETTINGS PROFILE {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }} SETTINGS
                    readonly = 1,
                    max_execution_time = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxExecutionTime" "value" .Values.sqlGateway.limits.maxExecutionTime) }} CONST,
                    max_result_rows = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxResultRows" "value" .Values.sqlGateway.limits.maxResultRows) }} CONST,
                    max_result_bytes = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxResultBytes" "value" .Values.sqlGateway.limits.maxResultBytes) }} CONST,
                    max_memory_usage = {{ include "traceroot.sqlGateway.limit" (dict "name" "maxMemoryUsage" "value" .Values.sqlGateway.limits.maxMemoryUsage) }} CONST;
                CREATE USER IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}
                    IDENTIFIED WITH sha256_hash BY '${RO_HASH}'
                    SETTINGS PROFILE '{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }}';
                ALTER USER {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}
                    IDENTIFIED WITH sha256_hash BY '${RO_HASH}'
                    SETTINGS PROFILE '{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }}';
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans_public_v1  TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces_public_v1 TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
              " | "${CH[@]}" --multiquery
              {{- end }}

              {{- if .Values.sqlGateway.enabled }}
              # The grants above are additive, so an account that already existed keeps
              # whatever it was carrying: a stale SELECT on another database, a role
              # granted by hand, FILE or URL. Customer SQL runs as this account, so the
              # intended state is not "has the two view grants" but "has these and
              # nothing else". Privileges and role grants are stripped first, since
              # REVOKE ALL PRIVILEGES leaves role membership untouched.
              echo "--- converging {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }} on exactly its two grants ---"
              REVOKES=$("${CH[@]}" --query "
                SELECT concat('REVOKE ', granted_role_name, ' FROM {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};')
                FROM system.role_grants WHERE user_name = '{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}'
                FORMAT TSVRaw" 2>&1) || REVOKES=""
              printf '%s\n' "
                REVOKE ALL PRIVILEGES ON *.* FROM {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
                ${REVOKES}
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans_public_v1  TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces_public_v1 TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
              " | "${CH[@]}" --multiquery

              # Asserted here rather than left to the verification hook, which is off by
              # default: a convergence that did not converge must not pass quietly.
              RO_GRANTS=$("${CH[@]}" --query "SHOW GRANTS FOR {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}" 2>&1)
              EXTRA=$(printf '%s\n' "$RO_GRANTS" | grep -v '^[[:space:]]*$' \
                | grep -vxF "GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans_public_v1 TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}" \
                | grep -vxF "GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces_public_v1 TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}" || true)
              if [ -n "$EXTRA" ]; then
                echo "FAIL: {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }} still holds grants beyond the two curated views:"
                printf '%s\n' "$EXTRA"
                exit 1
              fi
              {{- end }}

              # ClickHouse redacts passwords in query_log, so echoing the
              # resulting grants leaks nothing and records what was applied.
              echo "--- grants: {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }} ---"
              "${CH[@]}" --query "SHOW GRANTS FOR {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }}"
              {{- if .Values.sqlGateway.enabled }}
              echo "--- grants: {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }} ---"
              "${CH[@]}" --query "SHOW GRANTS FOR {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}"
              {{- end }}
              echo "provisioning complete"
          env:
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.clickhouse.auth.existingSecretKey | quote }}
            {{- if .Values.sqlGateway.enabled }}
            - name: SQL_GATEWAY_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.sqlGateway.secretKeys.readonlyPassword | quote }}
            {{- end }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
