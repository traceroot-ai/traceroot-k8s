{{/*
Renders on every install, not only when the gateway is enabled. The ClickHouse
migration creates the curated views with DEFINER = <writer> whether or not the
gateway serves traffic, and a missing definer fails that migration and with it the
release. So the writer is provisioned unconditionally; everything the gateway
alone needs -- the read-only user, its settings profile and its grants on the
views -- stays behind sqlGateway.enabled.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "traceroot.fullname" . }}-provision-clickhouse-users
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
  annotations:
    # Same install/upgrade phase as migrate-clickhouse but a lower weight, so the
    # gateway identities always exist before the migration creates the curated
    # views, whose DEFINER is the writer user. A missing writer fails the
    # CREATE VIEW outright, which is the intended, explicit dependency.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Retained after success on purpose; see migrate-clickhouse.yaml. This Job's
    # output is the only record that the identities were provisioned, for readers
    # who cannot open a ClickHouse session themselves.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  # Retained after success; bounded by the same knob as the migration job. Via the
  # shared helper, not inline: the value arrives as float64 from a values file and
  # int64 from --set, and Go renders a large float64 in exponent form, which is not
  # an integer and which the API server rejects mid-upgrade.
  {{- include "traceroot.migrations.ttl" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: provision-clickhouse-users
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: provision
          image: "{{ .Values.sqlGateway.image.repository }}:{{ .Values.sqlGateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # An array, not a string: a password containing whitespace or a glob
              # character would otherwise be re-split by the shell before it ever
              # reached the client, and authentication would fail for no visible reason.
              # Password through the environment, not argv: a --password argument is
              # readable in /proc/<pid>/cmdline for anything that can see the process.
              export CLICKHOUSE_PASSWORD="${CLICKHOUSE_ADMIN_PASSWORD}"
              CH=(clickhouse-client --host "{{ include "traceroot.clickhouse.hostname" . }}" --port 9000
                  --user "{{ .Values.clickhouse.auth.username }}")

              # Passwords are sent as their SHA-256 hash rather than as literals, so no
              # quote or backslash in a secret can terminate or alter the surrounding
              # DDL, and the raw value never appears in the statement at all.
              {{- if .Values.sqlGateway.enabled }}
              # Both keys are required once the gateway is on, and the Secret reference
              # above already fails the pod if either is absent. This catches the other
              # shape, a key that exists and is empty, which would otherwise provision
              # two accounts with the hash of the empty string.
              if [ -z "${SQL_GATEWAY_WRITER_PASSWORD:-}" ] || [ -z "${SQL_GATEWAY_RO_PASSWORD:-}" ]; then
                echo "FAIL: sqlGateway.enabled is set, so {{ .Values.sqlGateway.secretKeys.writerPassword }} and"
                echo "{{ .Values.sqlGateway.secretKeys.readonlyPassword }} must both be non-empty in secret {{ .Values.clickhouse.auth.existingSecret }}."
                exit 1
              fi
              {{- end }}

              # Nothing ever authenticates as the writer: the views are SQL SECURITY
              # DEFINER, which runs the body under the writer's grants and never asks
              # for its password. So with the gateway off, where no one supplies one,
              # a random password is generated for the CREATE and then discarded. The
              # reconciling ALTER is skipped in that case, so an existing writer keeps
              # the password it already has instead of being rotated every upgrade.
              WRITER_HASH=$(printf '%s' "${SQL_GATEWAY_WRITER_PASSWORD:-}" | sha256sum | cut -d' ' -f1)
              WRITER_ALTER="ALTER USER {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }} IDENTIFIED WITH sha256_hash BY '${WRITER_HASH}';"
              if [ -z "${SQL_GATEWAY_WRITER_PASSWORD:-}" ]; then
                # -v stops od collapsing a repeated block to `*`, which would shorten
                # the password instead of failing.
                WRITER_HASH=$(od -An -v -N32 -tx1 /dev/urandom | tr -d ' \n' | sha256sum | cut -d' ' -f1)
                WRITER_ALTER=""
              fi
              {{- if .Values.sqlGateway.enabled }}
              RO_HASH=$(printf '%s' "${SQL_GATEWAY_RO_PASSWORD}" | sha256sum | cut -d' ' -f1)
              {{- end }}

              # This hook can fire before the ClickHouse pod is Ready. The budget stays
              # well inside Helm's default 5m hook timeout -- matching it would mean the
              # release aborts before the last retries ever run. The final error is kept
              # and printed, so a wrong password is distinguishable from a slow start
              # instead of looking identical for the whole window.
              READY=""
              for i in $(seq 1 24); do
                if POLL_ERR=$("${CH[@]}" --query "SELECT 1" 2>&1); then READY=yes; break; fi
                echo "waiting for clickhouse ($i/24)"; sleep 5
              done
              if [ -z "$READY" ]; then
                echo "gave up waiting for clickhouse after 120s; last error:"
                printf '%s\n' "$POLL_ERR"; exit 1
              fi

              echo "--- clickhouse version ---"
              "${CH[@]}" --query "SELECT version()"

              # Creating users requires access management, which the stock admin
              # does not carry unless clickhouse.usersExtraOverrides grants it.
              # Printed before the DDL so a permissions failure below is
              # immediately explicable from this log alone.
              echo "--- grants held by the admin running this job ---"
              ADMIN_GRANTS=$("${CH[@]}" --query "SHOW GRANTS" 2>&1) || ADMIN_GRANTS=""
              printf '%s\n' "$ADMIN_GRANTS"

              # The bundled image grants its admin CREATE USER and SET DEFINER, so no
              # extra configuration is normally needed. An image or an external server
              # whose admin is narrower would otherwise fail several statements later
              # with a bare permission error; checked here so the message names both
              # the cause and the fix.
              for NEEDED in "CREATE USER" "SET DEFINER"; do
                if ! printf '%s' "$ADMIN_GRANTS" | grep -qF "$NEEDED"; then
                  echo "FAIL: the ClickHouse admin does not hold $NEEDED, which provisioning requires."
                  echo "Set clickhouse.usersExtraOverrides to enable access_management for this"
                  echo "account, or point the chart at an admin that already has it."
                  exit 1
                fi
              done

              # Idempotent and reconciling: CREATE ... IF NOT EXISTS leaves an
              # existing user on its old password, so each CREATE is followed by
              # an ALTER. Rotating a secret and re-running this hook is therefore
              # enough to propagate the new password. The writer's ALTER is the one
              # exception, skipped when no password was supplied, so that a
              # generated one never overwrites a real one.
              # Grants are recorded by name, so the read-only grants on the
              # curated views are accepted here even though the migration that
              # creates those views has not run yet.
              echo "--- provisioning identities ---"
              "${CH[@]}" --multiquery --query "
                CREATE USER IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }}
                    IDENTIFIED WITH sha256_hash BY '${WRITER_HASH}';
                ${WRITER_ALTER}
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans  TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }};
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }};
              "
              {{- if .Values.sqlGateway.enabled }}
              "${CH[@]}" --multiquery --query "
                CREATE SETTINGS PROFILE IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }} SETTINGS
                    readonly = 1,
                    max_execution_time = {{ .Values.sqlGateway.limits.maxExecutionTime }} CONST,
                    max_result_rows = {{ .Values.sqlGateway.limits.maxResultRows }} CONST,
                    max_result_bytes = {{ .Values.sqlGateway.limits.maxResultBytes }} CONST,
                    max_memory_usage = {{ .Values.sqlGateway.limits.maxMemoryUsage }} CONST;
                ALTER SETTINGS PROFILE {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }} SETTINGS
                    readonly = 1,
                    max_execution_time = {{ .Values.sqlGateway.limits.maxExecutionTime }} CONST,
                    max_result_rows = {{ .Values.sqlGateway.limits.maxResultRows }} CONST,
                    max_result_bytes = {{ .Values.sqlGateway.limits.maxResultBytes }} CONST,
                    max_memory_usage = {{ .Values.sqlGateway.limits.maxMemoryUsage }} CONST;
                CREATE USER IF NOT EXISTS {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}
                    IDENTIFIED WITH sha256_hash BY '${RO_HASH}'
                    SETTINGS PROFILE '{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }}';
                ALTER USER {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}
                    IDENTIFIED WITH sha256_hash BY '${RO_HASH}'
                    SETTINGS PROFILE '{{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.settingsProfile" "value" .Values.sqlGateway.settingsProfile) }}';
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.spans_public_v1  TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
                GRANT SELECT ON {{ include "traceroot.sqlGateway.identifier" (dict "name" "clickhouse.database" "value" .Values.clickhouse.database) }}.traces_public_v1 TO {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }};
              "
              {{- end }}

              # ClickHouse redacts passwords in query_log, so echoing the
              # resulting grants leaks nothing and records what was applied.
              echo "--- grants: {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }} ---"
              "${CH[@]}" --query "SHOW GRANTS FOR {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.writerUser" "value" .Values.sqlGateway.writerUser) }}"
              {{- if .Values.sqlGateway.enabled }}
              echo "--- grants: {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }} ---"
              "${CH[@]}" --query "SHOW GRANTS FOR {{ include "traceroot.sqlGateway.identifier" (dict "name" "sqlGateway.readonlyUser" "value" .Values.sqlGateway.readonlyUser) }}"
              {{- end }}
              echo "provisioning complete"
          env:
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.clickhouse.auth.existingSecretKey }}
            - name: SQL_GATEWAY_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.sqlGateway.secretKeys.writerPassword | quote }}
                  {{- if not .Values.sqlGateway.enabled }}
                  # With the gateway off this key is normally absent, and the hook
                  # generates a password instead. Without this the pod would not
                  # start, and every install without the gateway would fail.
                  optional: true
                  {{- end }}
            {{- if .Values.sqlGateway.enabled }}
            - name: SQL_GATEWAY_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.sqlGateway.secretKeys.readonlyPassword | quote }}
            {{- end }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
