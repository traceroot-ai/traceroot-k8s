{{- if and .Values.sqlGateway.enabled .Values.sqlGateway.verify }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "traceroot.fullname" . }}-verify-clickhouse-sql-gateway
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
  annotations:
    # Weighted above migrate-clickhouse so it runs after the curated views exist.
    # The two properties checked here are the whole point of the definer design
    # and neither is implied by the provisioning or migration hooks exiting 0:
    # a view could be created with the wrong definer, and the read-only user
    # could still reach the physical tables. Both are asserted, so an upgrade
    # that silently loses the isolation fails the release instead of passing.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: verify-clickhouse-sql-gateway
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: verify
          image: "{{ .Values.sqlGateway.image.repository }}:{{ .Values.sqlGateway.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              HOST="{{ include "traceroot.clickhouse.hostname" . }}"
              CH_ADMIN="clickhouse-client --host $HOST --port 9000 --user {{ .Values.clickhouse.auth.username }} --password ${CLICKHOUSE_ADMIN_PASSWORD}"
              CH_RO="clickhouse-client --host $HOST --port 9000 --user {{ .Values.sqlGateway.readonlyUser }} --password ${SQL_GATEWAY_RO_PASSWORD}"
              FAILED=0

              echo "--- clickhouse version ---"
              $CH_ADMIN --query "SELECT version()"

              # The definer is what lets the read-only user read the views
              # without holding any grant on the tables underneath. If a view
              # were created without it, isolation would rest on nothing.
              for VIEW in spans_public_v1 traces_public_v1; do
                echo "--- definer: $VIEW ---"
                DDL="$($CH_ADMIN --query "SHOW CREATE VIEW default.$VIEW")"
                echo "$DDL"
                if echo "$DDL" | grep -q "DEFINER = {{ .Values.sqlGateway.writerUser }}"; then
                  echo "OK: $VIEW is owned by {{ .Values.sqlGateway.writerUser }}"
                else
                  echo "FAIL: $VIEW is not owned by {{ .Values.sqlGateway.writerUser }}"; FAILED=1
                fi
              done

              # The curated views must stay readable by the gateway user.
              for VIEW in spans_public_v1 traces_public_v1; do
                echo "--- read-only user reads $VIEW ---"
                if $CH_RO --query "SELECT count() FROM default.$VIEW(project_id = 'helm-verification-probe')" >/dev/null 2>&1; then
                  echo "OK: {{ .Values.sqlGateway.readonlyUser }} can read $VIEW"
                else
                  echo "FAIL: {{ .Values.sqlGateway.readonlyUser }} cannot read $VIEW"; FAILED=1
                fi
              done

              # And must never reach the physical tables. ClickHouse answers
              # these with ACCESS_DENIED (code 497).
              for TABLE in spans traces; do
                echo "--- read-only user is denied default.$TABLE ---"
                if $CH_RO --query "SELECT count() FROM default.$TABLE" >/dev/null 2>&1; then
                  echo "FAIL: {{ .Values.sqlGateway.readonlyUser }} can read default.$TABLE"; FAILED=1
                else
                  echo "OK: {{ .Values.sqlGateway.readonlyUser }} denied default.$TABLE"
                fi
              done

              if [ "$FAILED" -ne 0 ]; then
                echo "sql gateway verification FAILED"; exit 1
              fi
              echo "sql gateway verification passed"
          env:
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.clickhouse.auth.existingSecretKey }}
            - name: SQL_GATEWAY_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.sqlGateway.secretKeys.readonlyPassword }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
{{- end }}
