apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "traceroot.fullname" . }}-migrate-clickhouse
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Deliberately not hook-succeeded. Only before-hook-creation is needed to
    # recreate this Job on the next release (a Job's spec.template is immutable,
    # so the stale object has to go first); hook-succeeded is housekeeping, and
    # it deletes the Job and its pod the moment the run succeeds, taking the
    # goose output with it. Failures are already retained by this policy. Keeping
    # the successful run means the record of which migrations applied survives for
    # anyone with read-only cluster access, who cannot query ClickHouse directly.
    # Retention is still bounded below by ttlSecondsAfterFinished, which unlike
    # this policy applies to failed Jobs as well as successful ones.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  # before-hook-creation only clears the Job when a later release runs one, so an
  # uninstalled or long-idle release would keep it forever. This bounds that.
  # Explicit nil check rather than `with`, so an operator can set 0 to collect
  # immediately; null omits the field and keeps the Job indefinitely.
  {{- include "traceroot.migrations.ttl" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: migrate-clickhouse
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migrations.clickhouse.image.repository }}:{{ .Values.migrations.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Percent-encode every byte of the password. A password holding a
              # URL-reserved character otherwise breaks DSN parsing outright, and
              # -v stops od collapsing a repeated 16-byte block to `*`, which would
              # silently produce the wrong password.
              PW=$(printf '%s' "${CLICKHOUSE_PASSWORD}" | od -An -v -tx1 | tr -d '\n ' | sed 's/../%&/g')
              # The DSN travels in the environment, never in argv: /proc/<pid>/cmdline is
              # world-readable, /proc/<pid>/environ is not. Exported here rather than in the
              # container's env: block, which would put it back in the rendered manifest.
              export GOOSE_DRIVER=clickhouse
              export GOOSE_DBSTRING="clickhouse://{{ .Values.clickhouse.auth.username }}:${PW}@{{ include "traceroot.clickhouse.hostname" . }}:9000/${CLICKHOUSE_DATABASE}"
              goose -dir /migrations up
              # Exit 0 from `up` only says nothing errored. Print the resulting
              # state so the log shows which migrations are actually applied.
              # Never allowed to fail the hook: the schema is already applied by this
              # point, and aborting the release over a read-only status query would
              # report a failed migration for a migration that succeeded.
              echo "--- migration state after apply ---"
              goose -dir /migrations status || echo "(status query failed; the migration above still succeeded)"
          env:
            # The views this Job creates must land in the same database the gateway
            # hooks grant on and the app reads from.
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.clickhouse.auth.existingSecretKey }}
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
