apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceroot.fullname" . }}-worker
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
    app: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "traceroot.selectorLabels" . | nindent 6 }}
      app: worker
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKeys.databaseUrl }}
            - name: CLICKHOUSE_HOST
              value: {{ include "traceroot.clickhouse.hostname" . | quote }}
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_NATIVE_PORT
              value: "9000"
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.auth.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.auth.existingSecret }}
                  key: {{ .Values.clickhouse.auth.existingSecretKey }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.secretKeys.url }}
            - name: REDIS_RESULT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.secretKeys.url }}
            - name: TRACEROOT_UI_URL
              value: "http://{{ include "traceroot.fullname" . }}-web:{{ .Values.web.port }}"
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.internalApiSecret }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.s3.endpoint | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.worker.pollIntervalSeconds | quote }}
            - name: BATCH_SIZE
              value: {{ .Values.worker.batchSize | quote }}
            {{- $legacyWorkerConcurrency := dict }}
            {{- $workerAdditionalEnv := list }}
            {{- range .Values.additionalEnv }}
            {{- if eq (default "" .name) "WORKER_CONCURRENCY" }}
            {{- if not (hasKey $legacyWorkerConcurrency "entry") }}
            {{- $_ := set $legacyWorkerConcurrency "entry" . }}
            {{- end }}
            {{- else }}
            {{- $workerAdditionalEnv = append $workerAdditionalEnv . }}
            {{- end }}
            {{- end }}
            {{- if hasKey $legacyWorkerConcurrency "entry" }}
            {{- toYaml (list (get $legacyWorkerConcurrency "entry")) | nindent 12 }}
            {{- else }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- end }}
            {{- with $workerAdditionalEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
