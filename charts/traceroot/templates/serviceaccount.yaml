{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Below every hook Job, all of which set serviceAccountName to this. A Job whose
    # ServiceAccount does not exist yet is admitted, then its pods are refused, so it
    # never fails and never succeeds: the release waits out the hook timeout and dies
    # with a bare "timed out waiting for the condition". Kept well clear of the Job
    # weights so a future hook does not land underneath it by accident.
    "helm.sh/hook-weight": "-10"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
