apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traceroot.fullname" . }}-billing
  labels:
    {{- include "traceroot.labels" . | nindent 4 }}
    app: billing
spec:
  replicas: {{ .Values.billing.replicas }}
  selector:
    matchLabels:
      {{- include "traceroot.selectorLabels" . | nindent 6 }}
      app: billing
  template:
    metadata:
      labels:
        {{- include "traceroot.selectorLabels" . | nindent 8 }}
        app: billing
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: billing
          image: "{{ .Values.billing.image.repository }}:{{ .Values.billing.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKeys.databaseUrl }}
            - name: BACKEND_INTERNAL_URL
              value: "http://{{ include "traceroot.fullname" . }}-rest:{{ .Values.rest.port }}"
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.internalApiSecret }}
            - name: USAGE_METERING_CRON
              value: {{ .Values.billing.usageMeteringCron | quote }}
            # Self-host (enableBilling=false) stops the billing job from setting the
            # Free-plan caps, and clears ones it set; read by isBillingEnabled().
            - name: ENABLE_BILLING
              value: {{ .Values.enableBilling | quote }}
            # Public app URL for the links in the usage emails, as web and detector get it.
            - name: NEXT_PUBLIC_APP_URL
              value: {{ .Values.betterAuth.url | quote }}
            # --- SMTP (conditional) ---
            {{- if .Values.smtp }}
            {{- if .Values.smtp.existingSecret }}
            - name: TRACEROOT_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: {{ .Values.smtp.keys.url }}
            - name: TRACEROOT_SMTP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: {{ .Values.smtp.keys.mailFrom }}
            {{- end }}
            {{- end }}
            # --- Stripe (conditional) ---
            {{- if .Values.stripe }}
            {{- if .Values.stripe.existingSecret }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.existingSecret }}
                  key: {{ .Values.stripe.keys.secretKey }}
            - name: STRIPE_PRICE_ID_AI_USAGE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.existingSecret }}
                  key: {{ .Values.stripe.keys.priceIdAiUsage }}
            - name: STRIPE_PRICE_ID_RCA_USAGE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.existingSecret }}
                  key: {{ .Values.stripe.keys.priceIdRcaUsage }}
            - name: STRIPE_PRICE_ID_DETECTOR_USAGE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripe.existingSecret }}
                  key: {{ .Values.stripe.keys.priceIdDetectorUsage }}
            {{- end }}
            {{- end }}
            {{- with .Values.additionalEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.billing.resources | nindent 12 }}
